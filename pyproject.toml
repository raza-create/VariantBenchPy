[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variantbenchpy"
version = "1.0.2"
description = "Benchmark design as a measurable source of uncertainty in variant-effect predictor evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VariantBenchPy contributors" }]
keywords = ["bioinformatics", "variant-effect-prediction", "benchmarking", "clinvar", "alphamissense"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pyarrow>=12",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
report = ["matplotlib>=3.6", "jinja2>=3.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
